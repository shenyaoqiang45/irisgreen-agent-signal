[project]
name = "irisgreen-tracking"
version = "0.5.0"
description = "IrisGreen object tracking algorithms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["irisgreen_tracking"]
