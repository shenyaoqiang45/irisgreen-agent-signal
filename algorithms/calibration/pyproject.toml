[project]
name = "irisgreen-calibration"
version = "0.5.0"
description = "IrisGreen projector-camera calibration procedure"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.9", "irisgreen-mapping", "irisgreen-detection"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["irisgreen_calibration"]
