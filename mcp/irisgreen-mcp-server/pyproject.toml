[project]
name = "irisgreen-mcp"
version = "0.4.0"
description = "IrisGreen MCP server: expose the physical-interface capabilities to AI agents"
requires-python = ">=3.10"
dependencies = ["mcp>=2", "irisgreen-capability"]

[project.scripts]
irisgreen-mcp = "irisgreen_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["irisgreen_mcp"]
