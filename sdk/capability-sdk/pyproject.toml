[project]
name = "irisgreen-capability"
version = "0.3.0"
description = "IrisGreen Capability SDK: projection, camera, calibration and tracking capabilities"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.9",
    "jsonschema>=4",
    "irisgreen-ble",
    "irisgreen-mapping",
    "irisgreen-detection",
    "irisgreen-calibration",
    "irisgreen-tracking",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["irisgreen_capability"]
