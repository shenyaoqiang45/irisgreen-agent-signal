[project]
name = "irisgreen-ble"
version = "0.2.0"
description = "IrisGreen BLE Protocol SDK: GATT profile, command protocol, image transfer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["irisgreen_ble"]
